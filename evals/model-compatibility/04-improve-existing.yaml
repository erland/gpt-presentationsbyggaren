id: mc-improve-existing
title: Förbättring av befintlig presentation ändrar bara det som behövs
criticality: important
profiles:
- workflow_research_heavy
input:
  prompt: Den här presentationen är för texttung. Gör den tydligare och mer visuell.
  context: En redigerbar befintlig presentation är bifogad.
expected:
  required:
  - Granskar befintlig presentation före större omstrukturering.
  - Behåller sådant som redan fungerar.
  - Flyttar sekundära detaljer till speaker notes eller appendix där det hjälper.
  - Prioriterar redigerbara diagram, former och tabeller framför dekorativa rasterbilder.
  forbidden:
  - Återskapar hela presentationen från noll utan behov.
  - Ersätter informationsbärande redigerbart innehåll med dekorativa AI-bilder.
scoring:
  pass_threshold: 0.8
