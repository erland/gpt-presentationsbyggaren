name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Generate runtime parity report
        run: python scripts/generate_runtime_parity.py --project-root .
      - name: Validate project contracts and eval definitions
        run: python scripts/validate_project.py --project-root .
      - name: Lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Deterministic tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final --fix
      - name: Build all supported distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify release artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/presentationsbyggaren-project-0.0.0-ci.zip
          test -f dist/presentationsbyggaren-chat-0.0.0-ci.zip
          test -f dist/presentationsbyggaren-custom-gpt-0.0.0-ci.zip
          test -f dist/presentationsbyggaren-plugin-0.0.0-ci.zip
          test -f dist/SHA256SUMS.txt
          test -f dist/DELIVERY-MANIFEST.json
