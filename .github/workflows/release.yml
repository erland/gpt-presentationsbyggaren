name: Build release distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest python-pptx pymupdf reportlab
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Generate runtime parity report
        run: python scripts/generate_runtime_parity.py --project-root .
      - name: Validate project
        run: python scripts/validate_project.py --project-root .
      - name: Deterministic tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Download pinned GPT Byggaren Engine 1.6.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.31/gpt-byggaren-engine-1.6.31.zip \
            -o /tmp/gpt-byggaren-engine.zip
          echo 'd8b9938e9e008415ee46eeb699d7520c2b7354a39f07f40fcac1fb6adc819e70  /tmp/gpt-byggaren-engine.zip' | sha256sum --check
          mkdir -p /tmp/gpt-byggaren-engine
          python -m zipfile -e /tmp/gpt-byggaren-engine.zip /tmp/gpt-byggaren-engine
      - name: Self-test canonical engine
        run: python /tmp/gpt-byggaren-engine/scripts/selftest_distribution_engine.py --source /tmp/gpt-byggaren-engine
      - name: Install canonical engine
        run: python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
      - name: Canonical lint
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Build tagged distributions with canonical engine
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Validate canonical distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify modular Skill behavior in every runtime projection
        run: python scripts/verify_runtime_behavior_projection.py --project-root . --version "${{ steps.version.outputs.version }}"
      - name: Verify modular OpenCode and complete Claude Project projection
        run: python scripts/verify_modular_runtime_projection.py --version "${{ steps.version.outputs.version }}"
      - name: Verify generated OpenCode validator tools
        run: python scripts/verify_opencode_generated_tools.py --archive "dist/presentationsbyggaren-opencode-${{ steps.version.outputs.version }}.zip"
      - name: Verify optional presentation Engine ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/presentationsbyggaren-engine-${{ steps.version.outputs.version }}.zip"
          python -m zipfile -e "dist/presentationsbyggaren-engine-${{ steps.version.outputs.version }}.zip" /tmp/presentation-engine-test
          python /tmp/presentation-engine-test/scripts/selftest_presentation_engine.py
      - name: Verify all six ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          for target in project chat plugin claude-project claude-skills opencode; do
            test -s "dist/presentationsbyggaren-${target}-${{ steps.version.outputs.version }}.zip"
          done
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
