contract_version: 1
tools:
  - id: document_read
    type: api_action
    requirement: required
    purpose: Läs användarens källmaterial och befintliga presentationsfiler när uppgiften bygger på dem.
    action: document.read
    deterministic: false
    mutates_workspace: false
    runtime_fallback: block
  - id: file_write
    type: api_action
    requirement: required
    purpose: Skriv och leverera storyboard, stödartefakter och presentationsfiler.
    action: file.write
    deterministic: true
    mutates_workspace: true
    runtime_fallback: block
  - id: web_research
    type: api_action
    requirement: recommended
    purpose: Verifiera aktuella eller externa faktapåståenden när källmaterialet inte räcker.
    action: web.research
    deterministic: false
    mutates_workspace: false
    runtime_fallback: degrade
  - id: data_analysis
    type: api_action
    requirement: recommended
    purpose: Kontrollera, transformera och visualisera tabeller och numeriska data när de driver slutsatsen.
    action: data.analyze
    deterministic: false
    mutates_workspace: false
    runtime_fallback: manual
  - id: image_generate
    type: api_action
    requirement: recommended
    purpose: Skapa informationsbärande illustrationer när redigerbara diagram eller former inte räcker.
    action: image.generate
    deterministic: false
    mutates_workspace: true
    runtime_fallback: degrade
  - id: pptx_validate
    type: script
    requirement: recommended
    purpose: Validera PPTX som ZIP/Open XML och hitta saknade Content-Type-delar eller relationship-targets före leverans.
    script: scripts/validate_pptx.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: presentation_generate
    type: api_action
    requirement: required
    purpose: Rendera ett validerat storyboard till PPTX, PDF eller HTML enligt användarens behov.
    action: presentation.generate
    deterministic: false
    mutates_workspace: true
    runtime_fallback: block
  - id: presentation_validate
    type: api_action
    requirement: recommended
    purpose: Validera PPTX-paket, interna relationer och renderbarhet före leverans.
    action: presentation.validate
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: presentation_preview
    type: api_action
    requirement: recommended
    purpose: Rendera slides till preview-bilder eller PDF för visuell kvalitetsgranskning.
    action: presentation.preview
    deterministic: false
    mutates_workspace: true
    runtime_fallback: manual
schema: schemas/tool-contract.schema.json
